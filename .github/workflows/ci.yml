name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (also checks that dashboards/paperclip.json matches the generator)
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install linters
        run: pip install ruff yamllint
      - name: Python
        run: ruff check .
      - name: YAML
        run: yamllint .
      - name: Shell
        run: shellcheck install.sh
      - name: Dashboard JSON is valid
        run: python -c "import json; json.load(open('dashboards/paperclip.json'))"

  dashboard-smoke:
    # Starts the real stack, feeds it sample traces and runs every dashboard query against it, so a query that
    # errors (bad PromQL or TraceQL, a wrong datasource type) fails CI instead of only showing up empty in Grafana.
    # There is no Paperclip in CI, so the sample sender stands in for it; it is never used against a real stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for Grafana
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          echo "Grafana did not become healthy in time" >&2
          exit 1
      - name: Send sample telemetry
        run: python3 tools/send_sample_telemetry.py
      - name: Give Tempo a moment to ingest it and generate span metrics
        run: sleep 30
      - name: Validate the dashboard at several ranges
        run: |
          for range in 15m 3h 24h; do
            echo "== $range"
            python3 tools/validate_dashboard.py --range "$range"
          done
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
