# Example for an existing Paperclip docker-compose / podman-compose file. Save it next to yours as
# docker-compose.override.yml (adjust the service name), after building the image with
#   ./install.sh --build-image <your paperclip image>
# and starting the stack (./install.sh), which creates the paperclip-net network.
services:
  paperclip:
    image: paperclip-otel   # your Paperclip image plus the OpenTelemetry packages
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: paperclip
    networks:
      - default
      - paperclip-net

networks:
  paperclip-net:
    external: true
