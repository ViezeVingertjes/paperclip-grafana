apiVersion: 1

# Replaces grafana/otel-lgtm's default provisioning (JVM + RED sample dashboards).
# The only dashboard is the generated Paperclip one, mounted at /paperclip-dashboards.
providers:
  - name: "Paperclip"
    type: file
    disableDeletion: false
    folder: "Paperclip"
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /paperclip-dashboards
      foldersFromFilesStructure: false
